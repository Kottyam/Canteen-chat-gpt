<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Go Canteen" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Go Canteen" />
    <title>Go Canteen</title>
    <style>
      :root { color-scheme: light; }
      html, body, #root { margin: 0; min-height: 100%; width: 100%; background-color: #ffffff; }
      html { background: #ffffff; }
      body {
        background: #ffffff;
        padding-top: env(safe-area-inset-top, 0px);
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
        box-sizing: border-box;
        overflow-x: hidden;
      }
      *, *::before, *::after { box-sizing: border-box; }

      body {
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Noto Sans Malayalam', sans-serif;
        color: #1f2937;
        background: #ffffff;
        -webkit-font-smoothing: antialiased;
      }
      input:not([type=checkbox]):not([type=radio]), select, textarea { border-radius: 0.75rem; }
      input:focus-visible, select:focus-visible, textarea:focus-visible {
        outline: none; border-color: #059669 !important; box-shadow: 0 0 0 3px rgba(16,185,129,0.25);
      }
      button:focus-visible, a:focus-visible, [role=tab]:focus-visible {
        outline: 2px solid #059669; outline-offset: 2px;
      }
      input[type=checkbox], input[type=radio] { accent-color: #059669; }
      button { transition: background-color .15s, box-shadow .15s, transform .05s; }
      button:not(:disabled):active { transform: scale(0.98); }
      table { border-collapse: collapse; }
      thead th { background: #f0fdf4; color: #065f46; font-weight: 600; }
      tbody tr:hover { background: #f9fafb; }
      .shadow, .shadow-md, .shadow-lg { box-shadow: 0 1px 2px rgba(6,78,59,.06), 0 4px 16px rgba(6,78,59,.06) !important; }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                '50': '#ecfdf5','100': '#d1fae5','200': '#a7f3d0','300': '#6ee7b7',
                '400': '#34d399','500': '#10b981','600': '#059669','700': '#047857',
                '800': '#065f46','900': '#064e3b','950': '#022c22',DEFAULT: '#059669'
              }
            }
          }
        }
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div id="gc-boot" data-testid="boot-splash" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#ffffff;">
        <img src="/gocanteen-icon.png" alt="Go Canteen" width="96" height="96" style="display:block;width:96px;height:96px;object-fit:contain;opacity:1;" />
      </div>
    </div>
    <script>
      (function () {
        try {
          if (sessionStorage.getItem('gocanteen_ui_ready') === '1') {
            var boot = document.getElementById('gc-boot');
            if (boot) boot.innerHTML = '<p style="margin:0;font-weight:800;font-size:1.5rem;letter-spacing:-0.025em;color:#065f46;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;">Go Canteen</p>';
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
