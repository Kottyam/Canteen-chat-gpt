name: Build GoCanteen Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor Android
        run: npm install @capacitor/android@7.4.0

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Remove Android system splash icon
        run: |
          set -e
          mkdir -p android/app/src/main/res/values-v31 android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/transparent_splash_icon.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="@android:color/transparent" />
          </shape>
          EOF
          THEME_NAME=$(grep -o 'android:theme="@style/[^\"]*"' android/app/src/main/AndroidManifest.xml | head -1 | sed 's/.*@style\///;s/"//')
          if [ -z "$THEME_NAME" ]; then
            echo "Could not determine Android application theme"
            exit 1
          fi
          echo "Using Android theme: $THEME_NAME"
          cat > android/app/src/main/res/values-v31/styles.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="$THEME_NAME">
                  <item name="android:windowSplashScreenBackground">@android:color/white</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/transparent_splash_icon</item>
                  <item name="android:windowSplashScreenIconBackgroundColor">@android:color/transparent</item>
              </style>
          </resources>
          EOF

      - name: Apply text-only Go Canteen launcher icon
        run: |
          set -e
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }
          root = Path('android/app/src/main/res')
          green = '#008A5A'
          font_path = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          for folder, size in sizes.items():
              out = root / folder
              out.mkdir(parents=True, exist_ok=True)
              image = Image.new('RGB', (size, size), 'white')
              draw = ImageDraw.Draw(image)
              font_size = max(10, int(size * 0.22))
              font = ImageFont.truetype(font_path, font_size)
              text = 'Go Canteen'
              bbox = draw.textbbox((0, 0), text, font=font)
              tw, th = bbox[2] - bbox[0], bbox[3] - bbox[1]
              draw.text(((size - tw) / 2, (size - th) / 2 - bbox[1]), text, font=font, fill=green)
              image.save(out / 'ic_launcher.png', 'PNG')
              image.save(out / 'ic_launcher_round.png', 'PNG')
          PY
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoCanteen-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk