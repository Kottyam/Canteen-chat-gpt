name: Build GoCanteen Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor Android and assets
        run: npm install @capacitor/android@7.4.0 @capacitor/assets --save-dev

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Prepare Go Canteen icon and splash assets
        run: |
          mkdir -p resources
          convert public/logo.svg -background none -resize 1024x1024 resources/icon.png
          convert public/logo.svg -background white -gravity center -resize 2200x2200 -extent 2732x2732 resources/splash.png

      - name: Generate Android icon and splash resources
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoCanteen-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
