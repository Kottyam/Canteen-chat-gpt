name: Build GoCanteen Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/legacy-tenant-linking

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_PirI2jk8r0rm5r3drpYMqA_f2IvAphx
      # Production Android OAuth must use the app deep link, never the WebView/dev-server origin.
      VITE_CAPACITOR_ANDROID_BUILD: 'true'
      VITE_GOOGLE_REDIRECT_URL: 'gocanteen://auth/callback'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Install Capacitor Android
        run: npm install @capacitor/android@7.4.0
      - name: Build web app
        run: npm run build
      - name: Verify production OAuth redirect
        run: |
          set -e
          test "$VITE_GOOGLE_REDIRECT_URL" = 'gocanteen://auth/callback'
          if grep -R -F 'http://localhost:3000' dist >/dev/null 2>&1; then
            echo 'Production web bundle contains forbidden localhost OAuth origin'
            exit 1
          fi
      - name: Add Android platform
        run: npx cap add android
      - name: Configure Firebase Android client
        env:
          FIREBASE_ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_ANDROID_GOOGLE_SERVICES_JSON:-}" ]; then
            echo 'Missing GitHub Actions secret FIREBASE_ANDROID_GOOGLE_SERVICES_JSON.'
            echo 'Add the Firebase Android google-services.json content as this repository secret before building Android.'
            exit 1
          fi
          printf '%s' "$FIREBASE_ANDROID_GOOGLE_SERVICES_JSON" > android/app/google-services.json
          chmod 600 android/app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('android/app/google-services.json')
          data = json.loads(path.read_text())
          clients = data.get('client') or []
          packages = [
              c.get('client_info', {}).get('android_client_info', {}).get('package_name')
              for c in clients
          ]
          if 'com.gocanteen.app' not in packages:
              raise SystemExit(f'Firebase config does not contain package com.gocanteen.app: {packages}')
          print('Firebase Android config verified for com.gocanteen.app')
          PY
          if ! grep -Fq "classpath 'com.google.gms:google-services:" android/build.gradle; then
            echo 'Capacitor generated Android project does not contain the Google Services Gradle classpath.'
            exit 1
          fi
          if ! grep -Fq "apply plugin: 'com.google.gms.google-services'" android/app/build.gradle; then
            echo 'Capacitor generated Android app does not contain the conditional Google Services plugin integration.'
            exit 1
          fi
          echo 'Capacitor Google Services Gradle integration verified; no duplicate plugin was added.'
      - name: Configure Google OAuth deep link
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          marker = 'android:exported="true"'
          pos = text.find(marker)
          if pos < 0:
              raise SystemExit('Android launcher activity was not found')
          activity_start = text.rfind('<activity', 0, pos)
          activity_end = text.find('>', pos) + 1
          if activity_start < 0 or activity_end <= 0:
              raise SystemExit('Could not locate Android activity tag')
          intent_filter = '''\n            <intent-filter>\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="gocanteen" android:host="auth" android:path="/callback" />\n            </intent-filter>'''
          if 'android:scheme="gocanteen"' not in text:
              text = text[:activity_end] + intent_filter + text[activity_end:]
              manifest.write_text(text)
          PY
      - name: Configure Android system-bar insets
        run: |
          set -e
          mkdir -p android/app/src/main/java/com/gocanteen/app
          cat > android/app/src/main/java/com/gocanteen/app/MainActivity.java <<'EOF'
          package com.gocanteen.app;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.Window;
          import androidx.core.view.WindowCompat;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Window window = getWindow();
                  WindowCompat.setDecorFitsSystemWindows(window, true);
                  window.setStatusBarColor(Color.WHITE);
                  window.setNavigationBarColor(Color.WHITE);
                  WindowCompat.getInsetsController(window, window.getDecorView()).setAppearanceLightStatusBars(true);
                  WindowCompat.getInsetsController(window, window.getDecorView()).setAppearanceLightNavigationBars(true);
              }
          }
          EOF
      - name: Remove Android system splash icon
        run: |
          set -e
          mkdir -p android/app/src/main/res/values-v31 android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/transparent_splash_icon.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="@android:color/transparent" />
          </shape>
          EOF
          THEME_NAME=$(grep -o 'android:theme="@style/[^\"]*"' android/app/src/main/AndroidManifest.xml | head -1 | sed 's/.*@style\///;s/"//')
          if [ -z "$THEME_NAME" ]; then echo "Could not determine Android application theme"; exit 1; fi
          echo "Using Android theme: $THEME_NAME"
          cat > android/app/src/main/res/values-v31/styles.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="$THEME_NAME">
                  <item name="android:windowSplashScreenBackground">@android:color/white</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/transparent_splash_icon</item>
                  <item name="android:windowSplashScreenIconBackgroundColor">@android:color/transparent</item>
              </style>
          </resources>
          EOF
      - name: Apply text-only Go launcher icon
        run: |
          set -e
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          sizes = {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          root = Path('android/app/src/main/res'); green='#008A5A'; font_path='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          for folder,size in sizes.items():
              out=root/folder; out.mkdir(parents=True,exist_ok=True); image=Image.new('RGB',(size,size),'white'); draw=ImageDraw.Draw(image)
              font=ImageFont.truetype(font_path,max(10,int(size*0.32))); text='Go'; bbox=draw.textbbox((0,0),text,font=font); tw,th=bbox[2]-bbox[0],bbox[3]-bbox[1]
              draw.text(((size-tw)/2,(size-th)/2-bbox[1]),text,font=font,fill=green); image.save(out/'ic_launcher.png','PNG'); image.save(out/'ic_launcher_round.png','PNG')
          PY
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          raw = os.environ["ANDROID_KEYSTORE_BASE64"]
          lines = [line.strip() for line in raw.splitlines()
                   if "BEGIN CERTIFICATE" not in line and "END CERTIFICATE" not in line]
          data = base64.b64decode("".join(lines))
          if len(data) < 1000:
              raise SystemExit("Decoded Android keystore is unexpectedly small.")
          Path("android/app/gocanteen-upload-key.jks").write_bytes(data)
          print(f"Android signing keystore decoded: {len(data)} bytes")
          PY
          chmod 600 android/app/gocanteen-upload-key.jks
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle")
          text = path.read_text()
          if "signingConfigs {\\n        release {" not in text:
              anchor = "    buildTypes {"
              if anchor not in text:
                  raise SystemExit("Could not find buildTypes block in android/app/build.gradle")
              signing = (
                  '    signingConfigs {\n'
                  '        release {\n'
                  '            storeFile file("gocanteen-upload-key.jks")\n'
                  '            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")\n'
                  '            keyAlias System.getenv("ANDROID_KEY_ALIAS")\n'
                  '            keyPassword System.getenv("ANDROID_KEY_PASSWORD")\n'
                  '        }\n'
                  '    }\n'
              )
              text = text.replace(anchor, signing + anchor, 1)
          build_anchor = "    buildTypes {"
          build_pos = text.find(build_anchor)
          release_pos = text.find("        release {", build_pos)
          if release_pos < 0:
              raise SystemExit("Could not find release build type in android/app/build.gradle")
          release_body_pos = release_pos + len("        release {")
          if "signingConfig signingConfigs.release" not in text[release_pos:text.find("        }", release_body_pos)]:
              text = text[:release_body_pos] + "\n            signingConfig signingConfigs.release" + text[release_body_pos:]
          path.write_text(text)
          PY
      - name: Make Gradle executable
        run: chmod +x android/gradlew
      - name: Build signed Release APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && ./gradlew assembleRelease bundleRelease
      - name: Verify signed Release APK
        run: |
          set -e
          test -f android/app/build/outputs/apk/release/app-release.apk
          test -f android/app/build/outputs/bundle/release/app-release.aab
          keytool -printcert -jarfile android/app/build/outputs/apk/release/app-release.apk
      - name: Upload signed Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GoCanteen-signed-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
